name: Bug report
description: Reportar un comportamiento incorrecto o fallo
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Describa el fallo con el mayor detalle posible. Los agentes leen este issue con `gh issue view` antes de implementar.

  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Qué ocurre y en qué contexto
      placeholder: Al subir un PDF inválido, el endpoint devuelve 500 en lugar de 400.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Secuencia mínima para ver el fallo
      placeholder: |
        1. Levantar Aspire
        2. Autenticarse en Swagger
        3. POST /api/documents/pdf-to-markdown/ con archivo corrupto
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Área afectada
      options:
        - apps/health
        - apps/users
        - apps/documents
        - config
        - aspire
        - docs
        - infra / docker
        - otro
    validations:
      required: true

  - type: checkboxes
    id: acceptance
    attributes:
      label: Criterios de aceptación
      description: Condiciones verificables para dar el issue por resuelto
      options:
        - label: El fallo ya no se reproduce con los pasos indicados
        - label: Existe prueba automatizada que cubre el caso (si aplica)
        - label: Documentación actualizada (si aplica)
        - label: Validaciones del repo pasan (ruff, check, OpenAPI); pytest si el issue lo requiere

  - type: textarea
    id: notes
    attributes:
      label: Notas adicionales
      description: Logs, capturas, entorno, ramas relacionadas
    validations:
      required: false
