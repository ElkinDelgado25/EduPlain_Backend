name: eduplain-backend

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academic_db}
      POSTGRES_USER: ${POSTGRES_USER:-academic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py bootstrap_superuser --skip-if-unconfigured &&
      python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DJANGO_ENVIRONMENT: ${DJANGO_ENVIRONMENT:-development}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      EDUPLAIN_BOOTSTRAP_ADMIN_USERNAME: ${EDUPLAIN_BOOTSTRAP_ADMIN_USERNAME:-}
      EDUPLAIN_BOOTSTRAP_ADMIN_EMAIL: ${EDUPLAIN_BOOTSTRAP_ADMIN_EMAIL:-}
      EDUPLAIN_BOOTSTRAP_ADMIN_FULL_NAME: ${EDUPLAIN_BOOTSTRAP_ADMIN_FULL_NAME:-}
      EDUPLAIN_BOOTSTRAP_ADMIN_ROLE: ${EDUPLAIN_BOOTSTRAP_ADMIN_ROLE:-}
      EDUPLAIN_BOOTSTRAP_ADMIN_PASSWORD: ${EDUPLAIN_BOOTSTRAP_ADMIN_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-academic_db}
      POSTGRES_USER: ${POSTGRES_USER:-academic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Inside Compose the database is always reached by its service name.
      # The .env value remains "localhost" for Django executed from the host.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
